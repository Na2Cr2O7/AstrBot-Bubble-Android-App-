name: Build Signed Release APK

# 只有手动点击才会运行：仓库 Actions 页面 → Build Signed Release APK → Run workflow
on:
  workflow_dispatch:
    inputs:
      flavor:
        description: '要构建的 flavor'
        required: true
        default: 'normal'
        type: choice
        options:
          - normal
          - profileTest
          - both
      build_name:
        description: '版本名（留空则用 pubspec.yaml 里的 version）'
        required: false
        default: ''
        type: string
      build_number:
        description: '版本号/build number（留空则用 pubspec.yaml 里的 version）'
        required: false
        default: ''
        type: string
      release_tag:
        description: 'Release tag（留空则用 v<版本名>，例如 v0.1.0-beta8）'
        required: false
        default: ''
        type: string
      create_release:
        description: '构建成功后发布 GitHub Release（同一 tag 会覆盖旧 APK）'
        required: true
        default: true
        type: boolean

# 同一时间只跑一个，避免并发抢占 Gradle 缓存
concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build signed APK (${{ inputs.flavor }})
    runs-on: ubuntu-latest
    # 冷构建要下 Flutter SDK、Gradle、AGP、依赖，留足余量
    timeout-minutes: 150
    env:
      # 海外 runner 访问国内 maven 镜像会拿到 403，直接跳过镜像省时间
      CI_SKIP_CN_MIRRORS: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Point Gradle wrapper at official distribution
        # 仓库里的 wrapper 为了国内速度指向腾讯镜像，海外 runner 上会非常慢甚至超时；
        # 只在本次 CI 运行期替换成官方地址，不提交回仓库。
        run: |
          sed -i 's#mirrors.cloud.tencent.com/gradle/#services.gradle.org/distributions/#' \
            android/gradle/wrapper/gradle-wrapper.properties
          grep distributionUrl android/gradle/wrapper/gradle-wrapper.properties

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # 与本地开发环境一致：Flutter 3.50.1 / Dart 3.14.0
          # （flutter_foreground_task 11.0.3 要求 Dart ^3.12.0，更老的 Flutter 无法解析依赖）
          flutter-version: '3.50.1'
          channel: stable
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Resolve version and tag
        id: version
        run: |
          set -euo pipefail
          PUB_VERSION="$(awk '/^version:/{print $2; exit}' pubspec.yaml)"
          PUB_NAME="${PUB_VERSION%%+*}"
          PUB_CODE="${PUB_VERSION##*+}"
          if [ "$PUB_CODE" = "$PUB_VERSION" ]; then PUB_CODE=""; fi

          NAME="$PUB_NAME"
          if [ -n "${{ inputs.build_name }}" ]; then NAME="${{ inputs.build_name }}"; fi
          CODE="$PUB_CODE"
          if [ -n "${{ inputs.build_number }}" ]; then CODE="${{ inputs.build_number }}"; fi

          TAG="${{ inputs.release_tag }}"
          if [ -z "$TAG" ]; then TAG="v$NAME"; fi

          # beta/alpha/rc 视为预发布，不抢 Latest 标记
          PRERELEASE=false
          case "$NAME" in
            *beta*|*alpha*|*rc*|*RC*) PRERELEASE=true ;;
          esac

          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          {
            echo "### 版本"
            echo ""
            echo "| 项 | 值 |"
            echo "| --- | --- |"
            echo "| 版本名 | \`$NAME\` |"
            echo "| 版本号 | \`${CODE:-（pubspec 默认）}\` |"
            echo "| Release tag | \`$TAG\` |"
            echo "| 预发布 | \`$PRERELEASE\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check Flutter environment
        run: |
          flutter --version
          java -version

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=""
          [ -z "${KEYSTORE_BASE64:-}" ] && missing="$missing KEYSTORE_BASE64"
          [ -z "${KEYSTORE_PASSWORD:-}" ] && missing="$missing KEYSTORE_PASSWORD"
          [ -z "${KEY_ALIAS:-}" ] && missing="$missing KEY_ALIAS"
          [ -z "${KEY_PASSWORD:-}" ] && missing="$missing KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::缺少仓库 Secret：$missing。请在 Settings → Secrets and variables → Actions 里添加后再运行。"
            exit 1
          fi

          # android/key.jks 与 android/key.properties 都写在 .gitignore 里，不会进仓库
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/key.jks

          # 与本地 android/key.properties 完全一致：app 模块下 ../key.jks → android/key.jks
          {
            echo "storePassword=${KEYSTORE_PASSWORD}"
            echo "keyPassword=${KEY_PASSWORD}"
            echo "keyAlias=${KEY_ALIAS}"
            echo "storeFile=../key.jks"
          } > android/key.properties

          echo "keystore: $(stat -c%s android/key.jks) bytes"
          # 不要把输出接到 head：pipefail 下 head 提前关闭管道会让 keytool 以 SIGPIPE 退出
          keytool -list -v -keystore android/key.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /tmp/keytool.txt
          grep -E '^(Alias name|Creation date|Valid from|Certificate fingerprints|SHA256|Owner|Issuer)' /tmp/keytool.txt || true

      - name: Get dependencies
        env:
          PUB_HOSTED_URL: https://pub.flutter-io.cn
          FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn
        run: flutter pub get

      - name: Build release APK
        env:
          PUB_HOSTED_URL: https://pub.flutter-io.cn
          FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn
        run: |
          set -euo pipefail

          if [ "${{ inputs.flavor }}" = "both" ]; then
            TARGETS="normal profileTest"
          else
            TARGETS="${{ inputs.flavor }}"
          fi

          ARGS=(--release)
          if [ -n "${{ steps.version.outputs.name }}" ]; then
            ARGS+=("--build-name=${{ steps.version.outputs.name }}")
          fi
          if [ -n "${{ steps.version.outputs.code }}" ]; then
            ARGS+=("--build-number=${{ steps.version.outputs.code }}")
          fi

          for f in $TARGETS; do
            echo "::group::flutter build apk --flavor $f"
            flutter build apk "${ARGS[@]}" --flavor "$f"
            echo "::endgroup::"
          done

          echo "== 产物 =="
          ls -lh build/app/outputs/apk/*/release/*.apk

      - name: Verify signature
        run: |
          set -euo pipefail
          SDK_DIR="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          APKSIGNER=$(find "$SDK_DIR/build-tools" -name apksigner -type f | sort -V | tail -1)
          echo "apksigner: $APKSIGNER"
          for apk in build/app/outputs/apk/*/release/*.apk; do
            echo "::group::$apk"
            "$APKSIGNER" verify --print-certs "$apk"
            sha256sum "$apk"
            echo "::endgroup::"
          done

      - name: Collect APKs with stable names
        id: apks
        run: |
          set -euo pipefail
          NAME="${{ steps.version.outputs.name }}"
          mkdir -p dist
          : > /tmp/files.txt
          for apk in build/app/outputs/apk/*/release/*.apk; do
            flavor="$(basename "$(dirname "$(dirname "$apk")")")"
            out="dist/AstrBot-OpenQQ-${NAME}-${flavor}.apk"
            cp "$apk" "$out"
            echo "$out" >> /tmp/files.txt
          done
          sort -o /tmp/files.txt /tmp/files.txt
          cat /tmp/files.txt
          # 供后续步骤按行读取
          while read -r f; do echo "== $f"; done < /tmp/files.txt

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: astrbot-release-apk-${{ github.run_number }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: ${{ inputs.create_release }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          NAME: ${{ steps.version.outputs.name }}
          CODE: ${{ steps.version.outputs.code }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          set -euo pipefail
          mapfile -t FILES < /tmp/files.txt

          NOTES=$(mktemp)
          {
            echo "手动构建（${{ inputs.flavor }} flavor）"
            echo
            echo "| 项 | 值 |"
            echo "| --- | --- |"
            echo "| 版本名 | \`$NAME\` |"
            echo "| 版本号 | \`${CODE:-（pubspec 默认）}\` |"
            echo "| 提交 | \`${GITHUB_SHA:0:7}\` |"
            echo "| 触发 | @${{ github.actor }} |"
            echo "| 运行 | [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |"
            echo
            echo "安装前请确认已卸载签名不同的旧版本。"
          } > "$NOTES"

          cat "$NOTES" >> "$GITHUB_STEP_SUMMARY"

          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG 已存在，覆盖其中的 APK（其余资产保留）"
            gh release upload "$TAG" "${FILES[@]}" --clobber
            gh release edit "$TAG" --notes-file "$NOTES"
          else
            echo "创建 Release $TAG"
            ARGS=(--title "AstrBot OpenQQ $NAME" --notes-file "$NOTES" --target "$GITHUB_SHA")
            if [ "$PRERELEASE" = "true" ]; then ARGS+=(--prerelease); fi
            gh release create "$TAG" "${FILES[@]}" "${ARGS[@]}"
          fi

          echo
          echo "Release: ${{ github.server_url }}/${{ github.repository }}/releases/tag/$TAG"
