name: Build Signed Release APK

# 只有手动点击才会运行：仓库 Actions 页面 → Build Signed Release APK → Run workflow
on:
  workflow_dispatch:
    inputs:
      flavor:
        description: '要构建的 flavor'
        required: true
        default: 'normal'
        type: choice
        options:
          - normal
          - profileTest
          - both
      build_name:
        description: '版本名（留空则用 pubspec.yaml 里的 version）'
        required: false
        default: ''
        type: string
      build_number:
        description: '版本号/build number（留空则用 pubspec.yaml 里的 version）'
        required: false
        default: ''
        type: string
      create_release:
        description: '构建成功后创建/更新 GitHub Release 并附上 APK'
        required: true
        default: false
        type: boolean

# 同一时间只跑一个，避免并发抢占 Gradle 缓存
concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    name: Build signed APK (${{ inputs.flavor }})
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('android/**/*.gradle*', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Check Flutter environment
        run: |
          flutter --version
          java -version

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=""
          [ -z "${KEYSTORE_BASE64:-}" ] && missing="$missing KEYSTORE_BASE64"
          [ -z "${KEYSTORE_PASSWORD:-}" ] && missing="$missing KEYSTORE_PASSWORD"
          [ -z "${KEY_ALIAS:-}" ] && missing="$missing KEY_ALIAS"
          [ -z "${KEY_PASSWORD:-}" ] && missing="$missing KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::缺少仓库 Secret：$missing。请在 Settings → Secrets and variables → Actions 里添加后再运行。"
            exit 1
          fi

          # android/key.jks 与 android/key.properties 都写在 .gitignore 里，不会进仓库
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/key.jks

          # 与本地 android/key.properties 完全一致：app 模块下 ../key.jks → android/key.jks
          {
            echo "storePassword=${KEYSTORE_PASSWORD}"
            echo "keyPassword=${KEY_PASSWORD}"
            echo "keyAlias=${KEY_ALIAS}"
            echo "storeFile=../key.jks"
          } > android/key.properties

          echo "keystore: $(stat -c%s android/key.jks) bytes"
          keytool -list -v -keystore android/key.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" | head -20

      - name: Get dependencies
        env:
          PUB_HOSTED_URL: https://pub.flutter-io.cn
          FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn
        run: flutter pub get

      - name: Build release APK
        env:
          PUB_HOSTED_URL: https://pub.flutter-io.cn
          FLUTTER_STORAGE_BASE_URL: https://storage.flutter-io.cn
        run: |
          set -euo pipefail

          if [ "${{ inputs.flavor }}" = "both" ]; then
            TARGETS="normal profileTest"
          else
            TARGETS="${{ inputs.flavor }}"
          fi

          EXTRA_ARGS=""
          if [ -n "${{ inputs.build_name }}" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --build-name=${{ inputs.build_name }}"
          fi
          if [ -n "${{ inputs.build_number }}" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --build-number=${{ inputs.build_number }}"
          fi

          for f in $TARGETS; do
            echo "::group::flutter build apk --release --flavor $f"
            flutter build apk --release --flavor "$f" $EXTRA_ARGS
            echo "::endgroup::"
          done

          echo "== 产物 =="
          ls -lh build/app/outputs/apk/*/release/*.apk

      - name: Verify signature
        run: |
          set -euo pipefail
          APKSIGNER=$(find "$ANDROID_SDK_ROOT/build-tools" -name apksigner -type f | sort -V | tail -1)
          echo "apksigner: $APKSIGNER"
          for apk in build/app/outputs/apk/*/release/*.apk; do
            echo "::group::$apk"
            "$APKSIGNER" verify --print-certs "$apk"
            sha256sum "$apk"
            echo "::endgroup::"
          done

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: astrbot-release-apk-${{ github.run_number }}
          path: build/app/outputs/apk/*/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: ${{ inputs.create_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: AstrBot OpenQQ 构建 ${{ github.run_number }}
          body: |
            手动构建（${{ inputs.flavor }} flavor）
            - 版本名：${{ inputs.build_name || '（跟随 pubspec.yaml）' }}
            - 版本号：${{ inputs.build_number || '（跟随 pubspec.yaml）' }}
            - 触发：@${{ github.actor }} · 提交 ${{ github.sha }}
          files: build/app/outputs/apk/*/release/*.apk
          prerelease: true
