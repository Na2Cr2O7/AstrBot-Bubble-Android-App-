
plugins {
    id 'com.android.application'
    id 'dev.flutter.flutter-gradle-plugin'
}
def keystorePropertiesFile = rootProject.file('key.properties')
def keystoreProperties = new Properties()
def hasKeystoreFile = keystorePropertiesFile.exists()
if (hasKeystoreFile) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
} else {
    logger.lifecycle('Warning: key.properties not found, fallback to debug keystore.')
}
android {
    namespace 'com.astrbot.astrbot_android'
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion
    packaging {
        jniLibs {
            // 替代清单文件中的 android:extractNativeLibs="true"
            useLegacyPackaging = true
        }
    }
    compileOptions {
        sourceCompatibility = 17
        targetCompatibility = 17
    }

    signingConfigs {
        if (hasKeystoreFile) {
            release {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }
    buildFeatures {
        resValues = true // 显式启用资源值生成功能
    }
    defaultConfig {
        applicationId 'com.na2cr2o7.astrbot_openqq'
        minSdk = 24
        targetSdk = 35
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    lintOptions {
        disable 'InvalidPackage'
    }

    flavorDimensions "distribution"
    productFlavors {
        normal {
            dimension "distribution"
        }
        profileTest {
            dimension "distribution"
            applicationIdSuffix ".profile"
            resValue "string", "app_name", "Astrbot-OpenQQ泡泡版"
        }
    }

    buildTypes {
        release {
            signingConfig hasKeystoreFile ? signingConfigs.release : signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            // 禁用对特定原生库的strip操作，避免处理错误
            packagingOptions {
                doNotStrip '**/libsudo.so'
            }
        }
        debug {
            applicationIdSuffix ".debug"
            resValue "string", "app_name", "Astrbot-OpenQQ泡泡版"
            signingConfig hasKeystoreFile ? signingConfigs.release : signingConfigs.debug
            minifyEnabled false
            shrinkResources false
            // 禁用对特定原生库的strip操作，避免处理错误
            packagingOptions {
                doNotStrip '**/libsudo.so'
            }
        }
        profile {
            signingConfig hasKeystoreFile ? signingConfigs.release : signingConfigs.debug
            minifyEnabled false
            shrinkResources false
            packagingOptions {
                doNotStrip '**/libsudo.so'
            }
        }
    }

    project.android.applicationVariants.all { variant ->
        variant.outputs.each { output ->
            output.versionCodeOverride = flutter.versionCode
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

flutter {
    source '../..'
}
dependencies {
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

// implementation fileTree(include: ['*.jar', '*aar'], dir: 'libs')
}
