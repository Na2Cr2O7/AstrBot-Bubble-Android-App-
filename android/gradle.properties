#org.gradle.jvmargs=-Xmx4G
# 512m Metaspace 会让 R8(minifyEnabled) 和 lintVital 报 OutOfMemoryError: Metaspace，
# 这里按 16G 内存机器给到 1.5G Metaspace / 5G 堆，并限制 worker 数避免并发把元空间打满。
org.gradle.jvmargs=-Xms2048m -Xmx5120m -XX:MaxMetaspaceSize=1536m
org.gradle.workers.max=4
android.useAndroidX=true
android.enableJetifier=true
systemProp.https.protocols=TLSv1.2,TLSv1.1,TLSv1
# Kotlin 增量编译缓存用 File.relativeTo() 存源文件路径，
# 而 pub 缓存在 C: 盘、工程在 E: 盘，跨盘符无法相对化，
# 会抛 "this and base files have different roots" 导致 BUILD FAILED (KT-63983)。
# 关闭增量编译以规避该跨盘符问题（Linux/macOS 单根文件系统无此问题）。
kotlin.incremental=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=true
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
